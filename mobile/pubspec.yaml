name: bolkhata
description: Voice-first multilingual digital khata for Bharat.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  drift: ^2.18.0
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.1
  path_provider: ^2.1.3
  path: ^1.9.0
  record: ^5.1.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
flutter:
  generate: true
  uses-material-design: true